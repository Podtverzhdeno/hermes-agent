name: Specialized Skill Harness Contracts

on:
  pull_request:
    paths:
      - "agent/skill_harness.py"
      - "agent/skill_commands.py"
      - "tools/skills_tool.py"
      - "skills/**/harness.json"
      - "skills/**/SKILL.md"
      - "optional-skills/**/harness.json"
      - "optional-skills/**/SKILL.md"
      - "tools/skills_sync.py"
      - "MANIFEST.in"
      - "tests/skill_harness/**"
      - "scripts/audit_skill_harnesses.py"
      - "scripts/evaluate_specialized_skills.py"
      - "scripts/skill_harness_safety_lint.py"
      - "tests/agent/test_skill_harness_integration.py"
      - ".github/workflows/skill-harness-contract.yml"
  push:
    branches: [main]
    paths:
      - "agent/skill_harness.py"
      - "skills/**/harness.json"
      - "tests/skill_harness/**"
permissions:
  contents: read

concurrency:
  group: skill-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Profile contracts ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Python syntax
        run: python -m compileall -q agent/skill_harness.py tests/skill_harness
      - name: Audit all bundled and optional skill coverage
        run: python -m scripts.audit_skill_harnesses --format markdown
      - name: Reject unsafe executable skill examples
        run: python -m scripts.skill_harness_safety_lint
      - name: Export pinned positive/negative routing fixtures
        run: python -m scripts.evaluate_specialized_skills export --root . --output skill-cases.jsonl
      - name: Validate individual contracts (offline, stdlib only)
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""
        run: python -m unittest discover -s tests/skill_harness -p test_*.py -v


  sdist-contract:
    name: Source distribution keeps individual harness profiles
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated packaging frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build distribution from project manifest
        run: python -m build --sdist --outdir dist
      - name: Verify source archive contains every reviewed harness
        shell: bash
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive, = Path("dist").glob("*.tar.gz")
          with tarfile.open(archive, "r:gz") as tar:
              entries = tar.getnames()
          profiles = [p for p in entries if p.endswith("/harness.json")]
          assert len(profiles) >= 27, (len(profiles), profiles)
          assert any("/skills/github/github-auth/harness.json" in p for p in profiles)
          assert any("/optional-skills/creative/blender-mcp/harness.json" in p for p in profiles)
          print("PASS: " + str(len(profiles)) + " reviewed harness files in source distribution")
          PY
