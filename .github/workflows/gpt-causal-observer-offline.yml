name: GPT Causal Observer Offline Contracts

on:
  pull_request:
    paths:
      - "gateway/gpt_causal_observer.py"
      - "tests/gateway/test_gpt_causal_observer.py"
      - ".github/workflows/gpt-causal-observer-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-causal-observer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-observer:
    name: stdlib contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile observer and tests
        run: |
          python -m py_compile gateway/gpt_causal_observer.py tests/gateway/test_gpt_causal_observer.py
      - name: No-key, no-network deterministic tests
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s tests/gateway -p test_gpt_causal_observer.py -v
