name: GPT Companion causal safety (offline)

on:
  push:
    branches:
      - audit/gpt-companion-causal-failclosed-20261122-a13
  pull_request:
    branches:
      - feat/gpt-companion-event-observer-sdd-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-companion-causal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-causal-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test runner only
        run: python -m pip install "pytest>=9,<10"
      - name: Compile observer and tests
        run: python -m compileall -q gpt_companion tests/gpt_companion
      - name: Run offline causal safety and CLI contract
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""
        run: python -m pytest -q -o addopts='' tests/gpt_companion
