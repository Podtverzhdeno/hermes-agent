name: GPT Integration Review (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/gpt_pr_guard.py
      - tests/coordination/test_gpt_pr_guard.py
      - docs/sdd/gpt-integration/**
      - .github/workflows/gpt-integration-review.yml
  schedule:
    - cron: '17 4,16 * * *'
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify guard contracts offline
        run: python -m unittest discover -s tests/coordination -p 'test_gpt_pr_guard.py' -v
      - name: Capture current public PR evidence (advisory, no writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/gpt_pr_guard.py --live "$GITHUB_REPOSITORY" \
            --output gpt-pr-review.json --snapshot-output gpt-pr-snapshot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-pr-review-${{ github.run_id }}
          path: |
            gpt-pr-review.json
            gpt-pr-snapshot.json
          retention-days: 7
          if-no-files-found: ignore
